name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # `pip install --group` needs pip >= 25.1.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: ruff check --output-format=github .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.deps }} deps)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        deps: [latest]
        include:
          # The maintainer's platform; also has a real ISO-8859-1 locale, so the
          # non-UTF-8 locale CLI test runs against a different code path than on Linux.
          - os: macos-latest
            python-version: "3.14"
            deps: latest
          # Lower bounds from pyproject.toml (textual>=2.0; textual 2.0 needs rich>=13.3.3).
          - os: ubuntu-latest
            python-version: "3.12"
            deps: lowest
            pins: textual==2.0.0 rich==13.3.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # `pip install --group` needs pip >= 25.1.
      - run: python -m pip install --upgrade pip
      - name: Install package and dev tools
        env:
          PINS: ${{ matrix.pins }}
        # PINS is intentionally unquoted: it is empty or a space-separated list of specifiers.
        run: |
          # shellcheck disable=SC2086
          python -m pip install -e . --group dev $PINS
      - run: python -m pip list
      - run: pytest
